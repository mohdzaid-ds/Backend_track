services:
  db:
    image: postgres:16
    container_name: your conatiner_name
    environment:
      POSTGRES_USER: useer
      POSTGRES_PASSWORD: your_password
      POSTGRES_DB: your_db_name
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
